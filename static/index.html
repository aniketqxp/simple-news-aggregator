<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed — News Aggregator</title>
    <meta name="description" content="A minimal, high-performance news aggregator with smart caching and real-time article extraction.">

    <!-- Open Graph -->
    <meta property="og:title" content="Feed — News Aggregator">
    <meta property="og:description" content="Real-time news aggregation with a premium, minimal interface. Built with FastAPI and vanilla JS.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://github.com/aniketqxp/simple-news-aggregator">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Feed — News Aggregator">
    <meta name="twitter:description" content="Real-time news aggregation with a premium, minimal interface.">

    <!-- Favicon: geometric abstract mark -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Crect x='4' y='4' width='11' height='11' rx='2' fill='%23a1a1aa'/%3E%3Crect x='17' y='4' width='11' height='11' rx='2' fill='%23a1a1aa' opacity='0.5'/%3E%3Crect x='4' y='17' width='11' height='11' rx='2' fill='%23a1a1aa' opacity='0.5'/%3E%3Crect x='17' y='17' width='11' height='11' rx='2' fill='%23a1a1aa' opacity='0.25'/%3E%3C/svg%3E">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- Color Thief -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.4.0/color-thief.umd.js" crossorigin="anonymous"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body class="antialiased pb-20 overflow-y-scroll hide-scrollbar-body">
    
    <!-- No-JS fallback -->
    <noscript>
        <div style="padding:2rem;text-align:center;color:#a1a1aa;font-family:Inter,system-ui,sans-serif;">
            <h1 style="color:#fafafa;margin-bottom:0.5rem;">Feed — News Aggregator</h1>
            <p>JavaScript is required to load and display live news articles.</p>
        </div>
    </noscript>

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 bg-zinc-950/80 backdrop-blur-xl border-b border-zinc-800/80">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between py-2.5 gap-3">
                
                <!-- Logo -->
                <div class="flex items-center space-x-2.5 flex-shrink-0">
                    <!-- Geometric logo mark: 4 squares with decreasing opacity -->
                    <svg class="w-5 h-5" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <rect x="4" y="4" width="11" height="11" rx="2" fill="#a1a1aa"/>
                        <rect x="17" y="4" width="11" height="11" rx="2" fill="#a1a1aa" opacity="0.5"/>
                        <rect x="4" y="17" width="11" height="11" rx="2" fill="#a1a1aa" opacity="0.5"/>
                        <rect x="17" y="17" width="11" height="11" rx="2" fill="#a1a1aa" opacity="0.25"/>
                    </svg>
                    <span class="text-[14px] font-semibold text-zinc-100 tracking-tight hidden sm:inline">Feed</span>
                </div>

                <!-- Search -->
                <form id="search-form" class="flex-grow max-w-md relative" role="search">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                            <svg class="h-3.5 w-3.5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </div>
                        <input type="text" id="search-input" placeholder="Search topics…" class="block w-full pl-8 pr-3 py-1.5 bg-zinc-900 border border-zinc-800 rounded-lg text-[13px] text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-zinc-600 transition-colors" required aria-label="Search news topics">
                    </div>
                </form>

                <!-- Right controls -->
                <div class="flex items-center space-x-2 flex-shrink-0">
                    <!-- Custom dropdown (rendered by JS) -->
                    <div id="count-dropdown-container"></div>
                    
                    <!-- Refresh -->
                    <button id="refresh-btn" class="p-1.5 rounded-md text-zinc-500 hover:text-zinc-300 hover:bg-zinc-800/50 transition-all" aria-label="Refresh news feed">
                        <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Category Chips -->
        <div class="border-t border-zinc-800/50">
            <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-1.5 overflow-x-auto hide-scrollbar">
                <div id="chips-container" class="flex space-x-1 whitespace-nowrap" role="tablist" aria-label="News categories"></div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        
        <!-- Status Banner (Visible only on issues) -->
        <div id="status-banner" class="hidden mb-6 p-3 rounded-xl border border-amber-500/20 bg-amber-500/5 flex items-start space-x-3 transition-all animate-fade-in-up">
            <div class="mt-0.5">
                <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>
            <div>
                <h3 class="text-[13px] font-semibold text-amber-200">Decoding Restricted</h3>
                <p id="status-banner-text" class="text-[12px] text-amber-500/80 mt-0.5">Google News is currently rate-limiting extraction. Images and descriptions may be unavailable.</p>
            </div>
        </div>
        
        <!-- Header -->
        <div class="mb-5 flex items-baseline justify-between">
            <div>
                <h1 id="current-topic-title" class="text-lg font-semibold text-zinc-100 tracking-tight">Top Stories</h1>
                <p class="text-zinc-600 text-[12px] mt-0.5">Real-time extraction</p>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 w-full" aria-live="polite">
            <div class="col-span-full mb-1 flex items-center space-x-2 text-zinc-500 text-[12px]">
                <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="font-medium">Extracting articles…</span>
            </div>
            <!-- Skeleton cards -->
            <div class="rounded-[10px] border border-zinc-800 overflow-hidden h-[340px] skeleton-pulse bg-zinc-900/50"></div>
            <div class="rounded-[10px] border border-zinc-800 overflow-hidden h-[340px] skeleton-pulse bg-zinc-900/50 hidden sm:block"></div>
            <div class="rounded-[10px] border border-zinc-800 overflow-hidden h-[340px] skeleton-pulse bg-zinc-900/50 hidden lg:block"></div>
            <div class="rounded-[10px] border border-zinc-800 overflow-hidden h-[340px] skeleton-pulse bg-zinc-900/50 hidden xl:block"></div>
        </div>

        <!-- Error State -->
        <div id="error-state" class="hidden py-16 flex flex-col items-center justify-center text-center max-w-sm mx-auto">
            <div class="w-10 h-10 bg-zinc-900 rounded-lg flex items-center justify-center mb-3 border border-zinc-800">
                <svg class="w-5 h-5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>
            <h3 class="text-sm font-medium text-zinc-300 mb-1">Connection failed</h3>
            <p class="text-zinc-500 text-[12px] mb-4">Check your network and try again.</p>
            <button onclick="fetchNews()" class="px-3 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-zinc-300 text-[12px] font-medium rounded-lg transition-colors border border-zinc-800">Retry</button>
        </div>

        <!-- News Grid -->
        <div id="news-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3"></div>
    </main>
    
    <!-- Footer -->
    <footer class="site-footer">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <span class="text-zinc-600 text-[11px]">Built by Aniket Shinde</span>
            <a href="https://github.com/aniketqxp/simple-news-aggregator" target="_blank" rel="noopener noreferrer" class="text-zinc-600 hover:text-zinc-400 transition-colors" aria-label="View source on GitHub">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path>
                </svg>
            </a>
        </div>
    </footer>

    <script src="js/app.js?v=7"></script>
</body>
</html>
