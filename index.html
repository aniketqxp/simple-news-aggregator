<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Global News</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        dark: '#121212',
                        darker: '#0a0a0a',
                        card: 'rgba(25, 25, 25, 0.65)',
                        primary: '#3b82f6',
                        'primary-hover': '#2563eb',
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="antialiased selection:bg-primary selection:text-white pb-20 overflow-y-scroll hide-scrollbar-body">
    
    <!-- Navigation / Top Bar -->
    <nav class="sticky top-0 z-50 glass border-b border-white/10 shadow-xl shadow-black/40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row md:items-center justify-between py-4 gap-4">
                
                <!-- Logo & Brand -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/30 ring-1 ring-white/20">
                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path>
                            </svg>
                        </div>
                        <h1 class="text-2xl font-bold text-white tracking-tight">Nexus<span class="text-primary">.</span></h1>
                    </div>
                    
                    <!-- Mobile Right controls (Refresh) -->
                    <div class="flex items-center space-x-2 md:hidden">
                        <button id="refresh-btn-mobile" class="p-2 rounded-lg bg-white/5 border border-white/10 hover:bg-white/10 text-gray-300 transition-colors shadow-inner" aria-label="Refresh">
                            <svg id="refresh-icon-mobile" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Search Form -->
                <form id="search-form" class="flex-grow max-w-2xl relative w-full">
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400 group-focus-within:text-primary transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </div>
                        <input type="text" id="search-input" placeholder="Search for news, topics, or publishers..." class="block w-full pl-10 pr-24 py-3 bg-white/5 border border-white/10 rounded-xl leading-5 text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary focus:bg-white/10 transition-all sm:text-sm shadow-inner" required>
                        <button type="submit" class="absolute inset-y-1.5 right-1.5 px-4 bg-primary hover:bg-primary-hover text-white text-sm font-medium rounded-lg transition-colors shadow-md shadow-blue-500/20">Search</button>
                    </div>
                </form>

                <!-- Desktop Right Controls -->
                <div class="hidden md:flex items-center space-x-4">
                    <div class="flex items-center space-x-2 bg-white/5 border border-white/10 rounded-xl px-2 py-1 shadow-inner">
                        <label for="count-select" class="text-xs text-gray-400 font-medium pl-1">Count:</label>
                        <div class="relative">
                            <select id="count-select" class="appearance-none bg-transparent text-gray-200 text-sm font-medium focus:outline-none focus:ring-0 block py-1.5 pl-2 pr-6 cursor-pointer hover:text-white transition-colors">
                                <option value="10" class="bg-darker">10</option>
                                <option value="20" selected class="bg-darker">20</option>
                                <option value="50" class="bg-darker">50</option>
                                <option value="80" class="bg-darker">80</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-1 text-gray-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </div>
                        </div>
                    </div>
                    
                    <button id="refresh-btn" class="p-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 text-gray-300 transition-all shadow-inner hover:shadow-lg hover:text-white group relative" aria-label="Refresh News">
                        <svg id="refresh-icon" class="w-5 h-5 transform group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        <span class="absolute -bottom-10 left-1/2 transform -translate-x-1/2 bg-black text-white text-xs py-1 px-2 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-white/10 shadow-lg z-50">Refresh</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Quick Select Chips -->
        <div class="border-t border-white/5 bg-black/30 backdrop-blur-md">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 overflow-x-auto hide-scrollbar">
                <div id="chips-container" class="flex space-x-3 whitespace-nowrap">
                    <!-- Chips will be inserted here by JS -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
        
        <!-- Header Section -->
        <div class="mb-8 flex flex-col md:flex-row md:justify-between md:items-end gap-4">
            <div>
                <h2 id="current-topic-title" class="text-3xl md:text-4xl font-bold text-white mb-2 tracking-tight">Top Stories</h2>
                <p class="text-gray-400 text-sm md:text-base">Discover the latest news and updates circulating right now</p>
            </div>
        </div>

        <!-- Loading Skeleton Grid -->
        <div id="loading-state" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 w-full">
            <!-- Loading message header -->
            <div class="col-span-full mb-2 flex items-center justify-center space-x-3 text-primary animate-pulse">
                <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="font-medium tracking-wide">Deep extracting article data...</span>
            </div>
            
            <!-- Skeleton Cards -->
            <div class="bg-card/40 backdrop-blur-md rounded-2xl border border-white/5 overflow-hidden h-[420px] flex flex-col animate-pulse">
                <div class="w-full h-48 bg-white/5"></div>
                <div class="p-6 flex flex-col flex-grow">
                    <div class="flex items-center space-x-3 mb-4">
                        <div class="w-8 h-8 rounded bg-white/10"></div>
                        <div class="h-3 bg-white/10 rounded w-24"></div>
                    </div>
                    <div class="h-5 bg-white/10 rounded w-full mb-3"></div>
                    <div class="h-5 bg-white/10 rounded w-4/5 mb-4"></div>
                    <div class="space-y-2 mt-auto">
                        <div class="h-3 bg-white/5 rounded w-full"></div>
                        <div class="h-3 bg-white/5 rounded w-5/6"></div>
                        <div class="h-3 bg-white/5 rounded w-2/3"></div>
                    </div>
                </div>
            </div>
            <!-- Duplicates for full grid effect -->
            <div class="bg-card/40 backdrop-blur-md rounded-2xl border border-white/5 overflow-hidden h-[420px] flex flex-col animate-pulse hidden sm:flex"><div class="w-full h-48 bg-white/5"></div><div class="p-6 flex flex-col flex-grow"><div class="flex items-center space-x-3 mb-4"><div class="w-8 h-8 rounded bg-white/10"></div><div class="h-3 bg-white/10 rounded w-24"></div></div><div class="h-5 bg-white/10 rounded w-full mb-3"></div><div class="h-5 bg-white/10 rounded w-4/5 mb-4"></div><div class="space-y-2 mt-auto"><div class="h-3 bg-white/5 rounded w-full"></div><div class="h-3 bg-white/5 rounded w-5/6"></div><div class="h-3 bg-white/5 rounded w-2/3"></div></div></div></div>
            <div class="bg-card/40 backdrop-blur-md rounded-2xl border border-white/5 overflow-hidden h-[420px] flex flex-col animate-pulse hidden md:flex"><div class="w-full h-48 bg-white/5"></div><div class="p-6 flex flex-col flex-grow"><div class="flex items-center space-x-3 mb-4"><div class="w-8 h-8 rounded bg-white/10"></div><div class="h-3 bg-white/10 rounded w-24"></div></div><div class="h-5 bg-white/10 rounded w-full mb-3"></div><div class="h-5 bg-white/10 rounded w-4/5 mb-4"></div><div class="space-y-2 mt-auto"><div class="h-3 bg-white/5 rounded w-full"></div><div class="h-3 bg-white/5 rounded w-5/6"></div><div class="h-3 bg-white/5 rounded w-2/3"></div></div></div></div>
            <div class="bg-card/40 backdrop-blur-md rounded-2xl border border-white/5 overflow-hidden h-[420px] flex flex-col animate-pulse hidden lg:flex"><div class="w-full h-48 bg-white/5"></div><div class="p-6 flex flex-col flex-grow"><div class="flex items-center space-x-3 mb-4"><div class="w-8 h-8 rounded bg-white/10"></div><div class="h-3 bg-white/10 rounded w-24"></div></div><div class="h-5 bg-white/10 rounded w-full mb-3"></div><div class="h-5 bg-white/10 rounded w-4/5 mb-4"></div><div class="space-y-2 mt-auto"><div class="h-3 bg-white/5 rounded w-full"></div><div class="h-3 bg-white/5 rounded w-5/6"></div><div class="h-3 bg-white/5 rounded w-2/3"></div></div></div></div>
        </div>

        <!-- Error State -->
        <div id="error-state" class="hidden py-20 flex flex-col items-center justify-center text-center max-w-md mx-auto bg-card rounded-3xl border border-white/5 shadow-2xl p-8 backdrop-blur-sm">
            <div class="w-20 h-20 bg-red-500/10 rounded-full flex items-center justify-center mb-6 border border-red-500/20 shadow-inner">
                <svg class="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>
            <h3 class="text-2xl font-bold text-white mb-3">Failed to load news</h3>
            <p class="text-gray-400 mb-8 leading-relaxed">There was an error connecting to the news source. This could be due to CORS issues, proxy limits, or network connectivity. Please try again.</p>
            <button onclick="fetchNews()" class="px-8 py-3 bg-white/10 hover:bg-white/20 text-white rounded-xl transition-all border border-white/10 shadow-lg hover:shadow-xl font-medium focus:ring-2 focus:ring-white/30 outline-none">
                Try Again
            </button>
        </div>

        <!-- News Grid -->
        <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Cards will be inserted here by JS -->
        </div>

    </main>
    
    <script src="app.js"></script>
</body>
</html>
