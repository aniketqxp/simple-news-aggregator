[project]
name = "news-aggregator"
version = "1.0.0"
description = "Real-time news aggregation with article extraction and image proxying."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "newspaper4k>=0.9.5",
    "googlenewsdecoder>=0.1.2",
    "lxml>=5.2.0",
    "lxml_html_clean",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
